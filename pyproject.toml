[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrtwin-reconstruct-core"
version = "0.1.0"
description = "Standalone MRtwin reconstruction core with GRAPPA, BART bindings, and reconstruction logic."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "SimpleITK",
    "typing",
    "gt-twixtools",
    "scipy==1.13.1"
]

[tool.setuptools.packages.find]
include = ["MRTwinReconstructCoreLib*"]